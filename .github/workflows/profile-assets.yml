name: Profile assets

# Builds the live GitHub card and the contribution snake, then publishes both
# to the `output` branch, which README.md reads them from. One job does both
# because publishing replaces everything on that branch.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *" # daily at 00:00 IST
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build live GitHub card
        run: node scripts/generate-card.mjs --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#33D6FF&color_dots=#161B22,#0E3A4A,#1C7FA3,#33D6FF,#7CFFB2
            dist/snake-light.svg?palette=github-light&color_snake=#0B84B0

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
