<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Contribution snake animation</title>
  <desc id="desc">A glowing snake path flowing across a GitHub-style grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05101B" />
      <stop offset="100%" stop-color="#0B1728" />
    </linearGradient>
    <linearGradient id="snake" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#33D6FF" />
      <stop offset="50%" stop-color="#7CFFB2" />
      <stop offset="100%" stop-color="#86A8FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7CFFB2" flood-opacity="0.45" />
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="34" height="34" fill="none" stroke="#20324B" stroke-width="1" opacity="0.5" />
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)" />
  <rect x="34" y="34" width="1132" height="192" rx="16" fill="url(#grid)" opacity="0.9" />

  <path d="M90 182 C180 90, 280 90, 360 150 S540 222, 640 146 S800 72, 910 134 S1040 210, 1110 96" fill="none" stroke="url(#snake)" stroke-width="10" stroke-linecap="round" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="0 900;180 720;0 900" dur="6s" repeatCount="indefinite" />
  </path>

  <g fill="#DFFBFF">
    <circle cx="90" cy="182" r="8" opacity="0.95" />
    <circle cx="165" cy="138" r="7" opacity="0.9" />
    <circle cx="250" cy="104" r="7" opacity="0.85" />
    <circle cx="338" cy="136" r="7" opacity="0.8" />
    <circle cx="430" cy="192" r="7" opacity="0.75" />
    <circle cx="520" cy="194" r="7" opacity="0.7" />
    <circle cx="615" cy="146" r="7" opacity="0.65" />
    <circle cx="705" cy="100" r="7" opacity="0.6" />
    <circle cx="798" cy="118" r="7" opacity="0.55" />
    <circle cx="890" cy="164" r="7" opacity="0.5" />
    <circle cx="980" cy="196" r="7" opacity="0.45" />
    <circle cx="1070" cy="124" r="7" opacity="0.4" />
  </g>

  <text x="600" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#EAF6FF">GitHub Contribution Snake</text>
  <text x="600" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8FB9DA">A stylized local fallback for the contribution animation</text>
</svg>