<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">GitHub trophies</title>
  <desc id="desc">A polished trophy showcase with three glowing achievement cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08111E" />
      <stop offset="100%" stop-color="#111A31" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2440" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#0E1526" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#33D6FF" />
      <stop offset="50%" stop-color="#7CFFB2" />
      <stop offset="100%" stop-color="#86A8FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#33D6FF" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)" />
  <text x="600" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#EAF6FF">GitHub Achievement Showcase</text>
  <text x="600" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8FB9DA">A compact visual summary of accomplishments and consistency</text>

  <g filter="url(#glow)">
    <rect x="70" y="92" width="330" height="126" rx="22" fill="url(#card)" stroke="#263755" />
    <rect x="435" y="92" width="330" height="126" rx="22" fill="url(#card)" stroke="#263755" />
    <rect x="800" y="92" width="330" height="126" rx="22" fill="url(#card)" stroke="#263755" />
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" fill="#F5FBFF">
    <text x="235" y="126" font-size="30" font-weight="800">🏆</text>
    <text x="235" y="154" font-size="22" font-weight="700">Codeathon 3.0</text>
    <text x="235" y="178" font-size="13" fill="#B7DDF7">1st Place</text>

    <text x="600" y="126" font-size="30" font-weight="800">📚</text>
    <text x="600" y="154" font-size="22" font-weight="700">Research</text>
    <text x="600" y="178" font-size="13" fill="#B7DDF7">International publications</text>

    <text x="965" y="126" font-size="30" font-weight="800">🎓</text>
    <text x="965" y="154" font-size="22" font-weight="700">Certified Builder</text>
    <text x="965" y="178" font-size="13" fill="#B7DDF7">Embedded Systems • IoT • Full Stack • SQL • AI</text>
  </g>

  <rect x="110" y="200" width="980" height="6" rx="3" fill="url(#accent)" opacity="0.8">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" repeatCount="indefinite" />
  </rect>
</svg>