<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AI themed glassmorphism hero banner</title>
  <desc id="desc">Animated gradient background with a translucent glass card.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="50%" stop-color="#0B1633" />
      <stop offset="100%" stop-color="#02101F" />
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#33D6FF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#33D6FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#7CFFB2" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7CFFB2" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#85F4FF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#86A8FF" stop-opacity="0.35" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)">
    <animate attributeName="fill" values="#050816;#0B1633;#050816" dur="12s" repeatCount="indefinite" />
  </rect>
  <circle cx="280" cy="120" r="170" fill="url(#glowA)">
    <animate attributeName="cx" values="260;330;260" dur="10s" repeatCount="indefinite" />
    <animate attributeName="cy" values="110;150;110" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="930" cy="310" r="180" fill="url(#glowB)">
    <animate attributeName="cx" values="900;850;900" dur="11s" repeatCount="indefinite" />
    <animate attributeName="cy" values="300;250;300" dur="9s" repeatCount="indefinite" />
  </circle>

  <g opacity="0.25" stroke="#9DEAFF" stroke-width="1.5" fill="none">
    <path d="M120 280 C220 180, 320 180, 420 270 S620 360, 740 250 S960 120, 1080 210" stroke-dasharray="8 14">
      <animate attributeName="stroke-dashoffset" from="0" to="120" dur="14s" repeatCount="indefinite" />
    </path>
    <path d="M160 100 C280 70, 390 80, 520 140 S770 220, 960 120 S1080 80, 1140 150" stroke-dasharray="6 12">
      <animate attributeName="stroke-dashoffset" from="120" to="0" dur="12s" repeatCount="indefinite" />
    </path>
  </g>

  <g fill="#9DEAFF" opacity="0.65">
    <circle cx="190" cy="230" r="4">
      <animate attributeName="cy" values="230;215;230" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="410" cy="145" r="3.5">
      <animate attributeName="cy" values="145;130;145" dur="3.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="705" cy="255" r="4.5">
      <animate attributeName="cy" values="255;240;255" dur="4.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="170" r="3.5">
      <animate attributeName="cy" values="170;155;170" dur="4.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <g filter="url(#shadow)">
    <rect x="130" y="84" width="940" height="252" rx="30" fill="url(#glass)" stroke="url(#border)" stroke-width="1.5" />
    <rect x="152" y="106" width="896" height="208" rx="24" fill="#09111F" fill-opacity="0.55" />
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" fill="#F5FBFF">
    <text x="600" y="172" font-size="54" font-weight="700" letter-spacing="1.2">Harishwaran P</text>
    <text x="600" y="222" font-size="22" fill="#B7DDF7">AI-focused full-stack builder crafting clean, modern digital experiences</text>
    <g font-size="15" font-weight="600" fill="#D8F3FF">
      <rect x="354" y="248" width="94" height="34" rx="17" fill="#33D6FF" fill-opacity="0.18" stroke="#33D6FF" stroke-opacity="0.4" />
      <text x="401" y="270">AI + ML</text>
      <rect x="456" y="248" width="126" height="34" rx="17" fill="#7CFFB2" fill-opacity="0.14" stroke="#7CFFB2" stroke-opacity="0.35" />
      <text x="519" y="270">Full Stack</text>
      <rect x="590" y="248" width="112" height="34" rx="17" fill="#86A8FF" fill-opacity="0.16" stroke="#86A8FF" stroke-opacity="0.35" />
      <text x="646" y="270">Product UI</text>
      <rect x="710" y="248" width="120" height="34" rx="17" fill="#FFD166" fill-opacity="0.13" stroke="#FFD166" stroke-opacity="0.32" />
      <text x="770" y="270">Design + Data</text>
    </g>
  </g>
</svg>