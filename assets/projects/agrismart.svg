<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="title desc">
  <title id="title">AgriSmart</title>
  <desc id="desc">AgriSmart: AI smart agriculture. Winner · DCE Hackathon. Farm-management ecosystem combining IoT sensors, blockchain traceability, predictive analytics and real-time monitoring.</desc>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .badge { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.3px; }
    .index { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace; font-size: 16px; fill: #8E7B6C; }
    .name { font-weight: 700; fill: #F7F1EA; }
    .kicker { font-weight: 600; fill: #FF7A1A; }
    .body { fill: #DCCDBF; }
    .tag { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace; font-size: 14px; fill: #B09A87; }
    .cta { font-size: 17px; font-weight: 600; fill: #FF7A1A; }
    .button { font-size: 17px; font-weight: 700; fill: #140C06; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0908"/>
      <stop offset="1" stop-color="#14100D"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC857"/>
      <stop offset="0.6" stop-color="#FFC857" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFC857" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FFC857" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFC857" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shape"><rect x="12" width="588" height="340" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#shape)">
    <rect x="12" width="588" height="340" fill="url(#bg)"/>
    <circle cx="600" cy="0" r="255" fill="url(#glow)"/>
    <rect x="12" width="588" height="3" fill="url(#bar)"/>
  </g>
  <rect x="12.5" y="0.5" width="587" height="339" rx="20" fill="none" stroke="#2B211A"/>
  <rect x="44" y="30" width="226" height="30" rx="15" fill="#FFC857" fill-opacity="0.1" stroke="#FFC857" stroke-opacity="0.45"/>
    <g transform="translate(57 36) scale(0.75)" fill="none" stroke="#FFC857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 13v4M8 21h8M10 17h4v4h-4z"/></g>
    <text class="badge" x="84" y="50" fill="#FFC857">WINNER · DCE HACKATHON</text>
  <text class="index" x="568" y="50" text-anchor="end">05</text>
  <text class="name" x="44" y="112" font-size="32">AgriSmart</text>
  <text class="kicker" x="44" y="142" font-size="18">AI smart agriculture</text>
  <text class="body" font-size="19"><tspan x="44" y="184">Farm-management ecosystem combining IoT sensors,</tspan><tspan x="44" y="211">blockchain traceability, predictive analytics and real-time</tspan><tspan x="44" y="238">monitoring.</tspan></text>
  <line x1="44" y1="270" x2="568" y2="270" stroke="#241B15"/>
  <rect x="44" y="286" width="49" height="30" rx="8" fill="#16110D" stroke="#2B211A"/><text class="tag" x="68.5" y="306" text-anchor="middle">IoT</text>
    <rect x="101" y="286" width="108" height="30" rx="8" fill="#16110D" stroke="#2B211A"/><text class="tag" x="155" y="306" text-anchor="middle">Blockchain</text>
    <rect x="217" y="286" width="108" height="30" rx="8" fill="#16110D" stroke="#2B211A"/><text class="tag" x="271" y="306" text-anchor="middle">Predictive</text>
