      <stop offset="1" stop-color="#14100D"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="0.6" stop-color="#FFB347" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FFB347" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shape"><rect x="12" width="588" height="340" rx="20"/></clipPath>
  </defs>
