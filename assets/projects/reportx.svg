<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="title desc">
  <title id="title">ReportX</title>
  <desc id="desc">ReportX: Offline AI audit generator. 2nd place · Project Expo. Audit reports from local LLMs that cut enterprise documentation effort by 70% while keeping every byte of data on-premise.</desc>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .badge { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.3px; }
    .index { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace; font-size: 16px; fill: #8E7B6C; }
    .name { font-weight: 700; fill: #F7F1EA; }
    .kicker { font-weight: 600; fill: #FF7A1A; }
    .body { fill: #DCCDBF; }
    .tag { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, Menlo, monospace; font-size: 14px; fill: #B09A87; }
    .cta { font-size: 17px; font-weight: 600; fill: #FF7A1A; }
    .button { font-size: 17px; font-weight: 700; fill: #140C06; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0908"/>
      <stop offset="1" stop-color="#14100D"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4CCC4"/>
      <stop offset="0.6" stop-color="#D4CCC4" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#D4CCC4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#D4CCC4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#D4CCC4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shape"><rect x="0" width="588" height="340" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#shape)">
    <rect x="0" width="588" height="340" fill="url(#bg)"/>
    <circle cx="588" cy="0" r="255" fill="url(#glow)"/>
    <rect x="0" width="588" height="3" fill="url(#bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="587" height="339" rx="20" fill="none" stroke="#2B211A"/>
  <rect x="32" y="30" width="241" height="30" rx="15" fill="#D4CCC4" fill-opacity="0.1" stroke="#D4CCC4" stroke-opacity="0.45"/>
    <g transform="translate(45 36) scale(0.75)" fill="none" stroke="#D4CCC4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l3 6M16 3l-3 6"/><circle cx="12" cy="15" r="6"/></g>
    <text class="badge" x="72" y="50" fill="#D4CCC4">2ND PLACE · PROJECT EXPO</text>
  <text class="index" x="556" y="50" text-anchor="end">04</text>
  <text class="name" x="32" y="112" font-size="32">ReportX</text>
  <text class="kicker" x="32" y="142" font-size="18">Offline AI audit generator</text>
  <text class="body" font-size="19"><tspan x="32" y="184">Audit reports from local LLMs that cut enterprise</tspan><tspan x="32" y="211">documentation effort by 70% while keeping every byte of</tspan><tspan x="32" y="238">data on-premise.</tspan></text>
  <line x1="32" y1="270" x2="556" y2="270" stroke="#241B15"/>
  <rect x="32" y="286" width="74" height="30" rx="8" fill="#16110D" stroke="#2B211A"/><text class="tag" x="69" y="306" text-anchor="middle">Ollama</text>
    <rect x="114" y="286" width="108" height="30" rx="8" fill="#16110D" stroke="#2B211A"/><text class="tag" x="168" y="306" text-anchor="middle">Local LLMs</text>
    <rect x="230" y="286" width="74" height="30" rx="8" fill="#16110D" stroke="#2B211A"/><text class="tag" x="267" y="306" text-anchor="middle">Python</text>
  <text class="cta" x="556" y="307" text-anchor="end">Live demo ↗</text>
