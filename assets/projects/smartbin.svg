    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A1A"/>
      <stop offset="0.6" stop-color="#FF7A1A" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/>
